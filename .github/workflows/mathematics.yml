name: Mathematical reliability

on:
  push:
    branches: [main]
    paths:
      - 'signallab_pc/**.py'
      - 'tests/test_math_*.py'
      - 'tests/test_health_exchange.py'
      - 'tests/test_interactive_analysis.py'
      - 'tests/test_window_convolution_analysis.py'
      - 'tests/test_measurement_views.py'
      - 'tests/test_update_channels_tools.py'
      - 'tests/test_time_frequency_library.py'
      - 'tools/check_math.py'
      - 'tools/audit_mathematics.py'
      - 'tools/math_audit_cases.py'
      - 'tools/check_workflows.py'
      - 'tests/test_workflow_contracts.py'
      - 'requirements-lock.txt'
      - 'requirements-quality.txt'
      - 'tools/check_static.py'
      - '.github/workflows/mathematics.yml'
  pull_request:
    paths:
      - 'signallab_pc/**.py'
      - 'tests/test_math_*.py'
      - 'tests/test_health_exchange.py'
      - 'tests/test_interactive_analysis.py'
      - 'tests/test_window_convolution_analysis.py'
      - 'tests/test_measurement_views.py'
      - 'tests/test_update_channels_tools.py'
      - 'tests/test_time_frequency_library.py'
      - 'tools/check_math.py'
      - 'tools/audit_mathematics.py'
      - 'tools/math_audit_cases.py'
      - 'tools/check_workflows.py'
      - 'tests/test_workflow_contracts.py'
      - 'requirements-lock.txt'
      - 'requirements-quality.txt'
      - 'tools/check_static.py'
      - '.github/workflows/mathematics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-mathematics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Install locked mathematical dependencies
        run: python -m pip install --disable-pip-version-check -c requirements-lock.txt numpy scipy sympy mpmath h5py
      - name: Check independent reference cases and result transport
        run: python -B -X utf8 tools/check_math.py
      - name: Preserve mathematical audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mathematics-${{ matrix.os }}-${{ github.run_id }}
          path: |
            work/math-checks.json
            work/math-audit.json
          if-no-files-found: ignore
          retention-days: 7

  workflow-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Install offscreen runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install locked application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Check real expression and system controls
        run: python -B -X utf8 tools/check_workflows.py
      - name: Preserve workflow report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workflows-${{ matrix.os }}-${{ github.run_id }}
          path: work/workflow-checks.json
          if-no-files-found: ignore
          retention-days: 7

  static-actions:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - run: python -m pip install --disable-pip-version-check -r requirements-quality.txt
      - run: python -B -X utf8 tools/check_static.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: static-actions-${{ github.run_id }}
          path: work/static-checks.json
          if-no-files-found: error
          retention-days: 7
