name: Mathematical reliability

on:
  push:
    branches: [main]
    paths:
      - 'signallab_pc/**.py'
      - 'tests/test_math_reliability.py'
      - 'tools/check_math.py'
      - 'requirements-lock.txt'
      - '.github/workflows/mathematics.yml'
  pull_request:
    paths:
      - 'signallab_pc/**.py'
      - 'tests/test_math_reliability.py'
      - 'tools/check_math.py'
      - 'requirements-lock.txt'
      - '.github/workflows/mathematics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-mathematics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Install locked mathematical dependencies
        run: python -m pip install --disable-pip-version-check -c requirements-lock.txt numpy scipy sympy mpmath
      - name: Check independent reference cases and result transport
        run: python -B -X utf8 tools/check_math.py
