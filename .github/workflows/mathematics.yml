name: Mathematical reliability

on:
  push:
    branches: [main, develop]
    paths:
      - 'signallab_pc/**.py'
      - 'tests/test_math_*.py'
      - 'tests/test_health_exchange.py'
      - 'tests/test_desktop_session.py'
      - 'tests/test_interactive_analysis.py'
      - 'tests/test_window_convolution_analysis.py'
      - 'tests/test_measurement_views.py'
      - 'tests/test_update_channels_tools.py'
      - 'tests/test_time_frequency_library.py'
      - 'tests/test_spectral_measurements.py'
      - 'tests/test_ar_estimation.py'
      - 'tests/test_plot_inspection.py'
      - 'tests/test_curve_reading.py'
      - 'tests/test_temporal_tools.py'
      - 'tests/test_frequency_measurements.py'
      - 'tests/test_state_studies.py'
      - 'tests/test_record_measurements.py'
      - 'tests/test_reconstruction_studies.py'
      - 'tests/test_basic_usability.py'
      - 'tests/test_frontend_workspace.py'
      - 'tests/test_toolbox.py'
      - 'tools/check_math.py'
      - 'tools/audit_mathematics.py'
      - 'tools/math_audit_cases.py'
      - 'tools/check_workflows.py'
      - 'tests/test_workflow_contracts.py'
      - 'requirements-lock.txt'
      - 'requirements-quality.txt'
      - '.python-version'
      - 'tools/check_engineering_baseline.py'
      - 'tools/check_engineering_package.py'
      - 'tools/native_sbom.py'
      - 'tools/check_candidate_update.py'
      - 'tools/check_resource_limits.py'
      - 'tools/capture_candidate_ui.py'
      - 'tools/check_static.py'
      - '.github/workflows/mathematics.yml'
  pull_request:
    paths:
      - 'signallab_pc/**.py'
      - 'tests/test_math_*.py'
      - 'tests/test_health_exchange.py'
      - 'tests/test_desktop_session.py'
      - 'tests/test_interactive_analysis.py'
      - 'tests/test_window_convolution_analysis.py'
      - 'tests/test_measurement_views.py'
      - 'tests/test_update_channels_tools.py'
      - 'tests/test_time_frequency_library.py'
      - 'tests/test_spectral_measurements.py'
      - 'tests/test_ar_estimation.py'
      - 'tests/test_plot_inspection.py'
      - 'tests/test_curve_reading.py'
      - 'tests/test_temporal_tools.py'
      - 'tests/test_frequency_measurements.py'
      - 'tests/test_state_studies.py'
      - 'tests/test_record_measurements.py'
      - 'tests/test_reconstruction_studies.py'
      - 'tests/test_basic_usability.py'
      - 'tests/test_frontend_workspace.py'
      - 'tests/test_toolbox.py'
      - 'tools/check_math.py'
      - 'tools/audit_mathematics.py'
      - 'tools/math_audit_cases.py'
      - 'tools/check_workflows.py'
      - 'tests/test_workflow_contracts.py'
      - 'requirements-lock.txt'
      - 'requirements-quality.txt'
      - '.python-version'
      - 'tools/check_static.py'
      - '.github/workflows/mathematics.yml'
  workflow_dispatch:
    inputs:
      engineering_baseline:
        description: Run the complete engineering baseline with line and branch coverage
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core-mathematics:
    if: ${{ !inputs.engineering_baseline && github.ref != 'refs/heads/develop' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - name: Install locked mathematical dependencies
        run: python -m pip install --disable-pip-version-check -c requirements-lock.txt numpy scipy sympy mpmath h5py
      - name: Check independent reference cases and result transport
        run: python -B -X utf8 tools/check_math.py
      - name: Preserve mathematical audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mathematics-${{ matrix.os }}-${{ github.run_id }}
          path: |
            work/math-checks.json
            work/math-audit.json
          if-no-files-found: ignore
          retention-days: 7

  workflow-integration:
    if: ${{ !inputs.engineering_baseline && github.ref != 'refs/heads/develop' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - name: Install offscreen runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install locked application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Check real expression and system controls
        run: python -B -X utf8 tools/check_workflows.py
      - name: Preserve workflow report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workflows-${{ matrix.os }}-${{ github.run_id }}
          path: work/workflow-checks.json
          if-no-files-found: ignore
          retention-days: 7

  static-actions:
    if: ${{ !inputs.engineering_baseline && github.ref != 'refs/heads/develop' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - run: python -m pip install --disable-pip-version-check -r requirements-quality.txt
      - run: python -B -X utf8 tools/check_static.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: static-actions-${{ github.run_id }}
          path: work/static-checks.json
          if-no-files-found: error
          retention-days: 7

  engineering-baseline:
    if: ${{ inputs.engineering_baseline || github.ref == 'refs/heads/develop' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - name: Install offscreen runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libfontconfig1
      - name: Install the locked baseline environment
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-lock.txt -r requirements-quality.txt -r requirements-engineering.txt
          python -m pip check
      - name: Verify the clean revision and measure coverage
        run: python -B -X utf8 tools/check_engineering_baseline.py --output work/engineering-baseline
      - name: Verify a disposable portable with the fixed Qt runtime
        if: ${{ !cancelled() }}
        run: python -B -X utf8 tools/check_engineering_package.py --output work/engineering-baseline/packaged-smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: engineering-baseline-${{ matrix.os }}-${{ github.run_id }}
          path: |
            work/engineering-baseline/*.json
            work/engineering-baseline/*.log
          if-no-files-found: error
          retention-days: 14

  engineering-distribution:
    if: ${{ github.ref == 'refs/heads/develop' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - name: Refresh Ubuntu runtime and install graphical dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade libssl3 openssl
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-sync1 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0 patchelf xvfb xauth
      - name: Audit candidate Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = '.\.venv\Scripts\python.exe'
          & $python -m pip install --only-binary=:all: -r requirements-lock.txt -r requirements-quality.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -B tools/check_resource_limits.py --output work/distribution-audit/resources.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build_portable.ps1
          $version = & $python -B -c 'from signallab_pc import __version__; print(__version__)'
          & $python -B tools/native_sbom.py "outputs/SignalLab-PC-$version.exe" --output work/distribution-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $python -B tools/build_installers.py windows --iscc $iscc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -B tools/check_candidate_update.py "outputs/SignalLab-PC-$version-setup.exe" --iscc $iscc --output work/distribution-audit/update.json
      - name: Audit candidate Linux distribution
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: -r requirements-lock.txt -r requirements-quality.txt
          .venv/bin/python -B tools/check_resource_limits.py --output work/distribution-audit/resources.json
          xvfb-run -a -s '-screen 0 1920x1080x24' .venv/bin/python -B tools/capture_candidate_ui.py --output work/distribution-audit/ui
          bash build_portable_linux.sh
          version=$(.venv/bin/python -B -c 'from signallab_pc import __version__; print(__version__)')
          .venv/bin/python -B tools/native_sbom.py "outputs/SignalLab-PC-$version-linux-x86_64.tar.gz" --output work/distribution-audit
          .venv/bin/python -B tools/build_installers.py linux
          .venv/bin/python -B tests/linux_installation_contract.py
          .venv/bin/python -B tools/check_candidate_update.py "outputs/SignalLab-PC-$version-linux-x86_64.run" --output work/distribution-audit/update.json
      - name: Preserve reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: engineering-distribution-${{ matrix.os }}-${{ github.run_id }}
          path: |
            work/distribution-audit/
            work/workflow-checks.json
          if-no-files-found: error
          retention-days: 14
