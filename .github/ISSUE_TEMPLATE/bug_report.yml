name: Informar un problema
description: Un cálculo, una importación o una parte de la interfaz no funciona como se espera.
title: "[Error] "
body:
  - type: input
    id: version
    attributes:
      label: Versión de SignalLab PC
      description: Aparece en el título o en Ayuda → Acerca de SignalLab.
      placeholder: 1.8.0
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Herramienta
      placeholder: Transformada Z inversa, Diseñar filtro, CAS…
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Datos y pasos
      description: Incluí fórmula o coeficientes, origen, unidades, ROC y método cuando corresponda.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
      description: Una expresión, referencia o ejemplo pequeño ayuda a comparar el cálculo.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado obtenido
      description: Copiá el mensaje o adjuntá una captura si es un problema visual.
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: Sistema operativo y pantalla
      description: Indicá Windows o distribución Linux y su versión. Para la interfaz, añadí resolución y escala de pantalla.
