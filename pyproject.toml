[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signallab-pc"
dynamic = ["version"]
description = "Migración de escritorio de SignalLab para Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.0",
  "h5py==3.16.0",
  "scipy==1.18.0",
  "sympy==1.14.0",
  "matplotlib==3.11.2",
  "PySide6==6.10.0",
]

[project.scripts]
signallab-pc = "signallab_pc.__main__:main"

[tool.setuptools.packages.find]
include = ["signallab_pc*"]

[tool.setuptools.dynamic]
version = {attr = "signallab_pc.__version__"}

[tool.setuptools.package-data]
signallab_pc = ["assets/*"]
